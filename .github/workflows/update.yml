name: Update Timetable

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create password file securely
        run: echo "${{ secrets.TAM_PASSWORD }}" > tam-password.txt

      - name: Run the scraper
        run: cargo run -- --config config.json --output timetable.ics

      - name: Commit and push the .ics file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add timetable.ics
          git commit -m "chore: update timetable" || echo "No changes to commit"
          git push
